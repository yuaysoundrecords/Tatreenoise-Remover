name: Build and validate Windows and macOS
on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Also build macOS after Windows validation passes'
        type: boolean
        default: false
  push:
    paths: ['Source/**', 'assets/**', 'tests/**', 'scripts/**', 'macos/**', 'CMakeLists.txt', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check packaging guards
        shell: pwsh
        run: ./tests/PackageWindows.Tests.ps1
      - name: Build, test, validate and package Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Log = Join-Path $PWD 'windows-build.log'
          try {
            ./scripts/build-windows.ps1 -BuildDirectory build-windows-msvc *>&1 | Tee-Object -FilePath $Log
          } catch {
            $Lines = if (Test-Path $Log) { @(Get-Content $Log) } else { @() }
            $Errors = @($Lines | Where-Object { $_ -match 'error [A-Z][0-9]+|FAIL |failed|Exception' } | Select-Object -First 20)
            $Detail = (@($_.ToString()) + $Errors + @($Lines | Select-Object -Last 35)) -join "`n"
            $Detail = $Detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows build or validation failed::$Detail"
            throw
          } finally {
            New-Item -ItemType Directory -Force 'build-windows-msvc/validation' | Out-Null
            if (Test-Path $Log) { Copy-Item $Log 'build-windows-msvc/validation/build-log.txt' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation-evidence
          path: build-windows-msvc/validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Tatree-2-Windows-x64-tested
          path: build-windows-msvc/package/*.zip
          if-no-files-found: error
  macos:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_macos)
    runs-on: macos-14
    env:
      TATREE_TEST_SYSTEM_INSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Build universal AU, VST3 and Standalone; test and package
        run: |
          set +e
          bash scripts/build-macos.command 2>&1 | tee macos-build.log
          result=${PIPESTATUS[0]}
          mkdir -p build-macos/validation
          cp macos-build.log build-macos/validation/build-log.txt
          if [ "$result" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s="\n".join(Path("macos-build.log").read_text(errors="replace").splitlines()[-65:]); print("::error title=macOS validation failed::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-validation-evidence
          path: build-macos/validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Tatree-2-macOS-universal-tested
          path: build-macos/package/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Tatree-2-macOS-Setup-UNSIGNED-TEST
          path: |
            build-macos/installer/*.pkg
            build-macos/installer/*.sha256
          if-no-files-found: error
