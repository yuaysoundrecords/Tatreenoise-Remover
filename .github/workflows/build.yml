name: Windows x64 build and validation
on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Also build macOS after Windows validation passes'
        type: boolean
        default: false
  push:
    paths: ['Source/**', 'assets/**', 'tests/**', 'scripts/**', 'CMakeLists.txt', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check packaging guards
        shell: pwsh
        run: ./tests/PackageWindows.Tests.ps1
      - name: Build, test, validate and package Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Log = Join-Path $PWD 'windows-build.log'
          try {
            ./scripts/build-windows.ps1 -BuildDirectory build-windows-msvc *>&1 | Tee-Object -FilePath $Log
          } catch {
            $Lines = if (Test-Path $Log) { @(Get-Content $Log) } else { @() }
            $Errors = @($Lines | Where-Object { $_ -match 'error [A-Z][0-9]+|FAIL |failed|Exception' } | Select-Object -First 20)
            $Detail = (@($_.ToString()) + $Errors + @($Lines | Select-Object -Last 35)) -join "`n"
            $Detail = $Detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows build or validation failed::$Detail"
            throw
          } finally {
            New-Item -ItemType Directory -Force 'build-windows-msvc/validation' | Out-Null
            if (Test-Path $Log) { Copy-Item $Log 'build-windows-msvc/validation/build-log.txt' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation-evidence
          path: build-windows-msvc/validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Tatree-2-Windows-x64-tested
          path: build-windows-msvc/package/*.zip
          if-no-files-found: error
  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.build_macos
    needs: windows
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Audio and motion tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: Tatree-2-macOS-test-build
          path: |
            build/Tatree_artefacts/Release/VST3/
            build/Tatree_artefacts/Release/AU/
            build/Tatree_artefacts/Release/Standalone/
          if-no-files-found: error
