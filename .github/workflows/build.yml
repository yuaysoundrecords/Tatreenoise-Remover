name: Build and validate Windows and macOS
on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build and validate Windows Setup'
        type: boolean
        default: true
      build_macos:
        description: 'Build and validate Mac Universal Setup'
        type: boolean
        default: false
      macos_runner:
        description: 'Standard macOS runner (no large/paid runner)'
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15
  push:
    paths: ['Source/**', 'assets/**', 'tests/**', 'scripts/**', 'macos/**', 'windows/**', 'docs/*INSTALL*', 'docs/MACOS-APPROVAL-TH-EN.txt', 'CMakeLists.txt', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check packaging guards
        shell: pwsh
        run: ./tests/PackageWindows.Tests.ps1
      - name: Build, test, validate and package Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Log = Join-Path $PWD 'windows-build.log'
          try {
            ./scripts/build-windows.ps1 -BuildDirectory build-windows-msvc *>&1 | Tee-Object -FilePath $Log
          } catch {
            $Lines = if (Test-Path $Log) { @(Get-Content $Log) } else { @() }
            $Errors = @($Lines | Where-Object { $_ -match 'error [A-Z][0-9]+|FAIL |failed|Exception' } | Select-Object -First 20)
            $Detail = (@($_.ToString()) + $Errors + @($Lines | Select-Object -Last 35)) -join "`n"
            $Detail = $Detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows build or validation failed::$Detail"
            throw
          } finally {
            New-Item -ItemType Directory -Force 'build-windows-msvc/validation' | Out-Null
            if (Test-Path $Log) { Copy-Item $Log 'build-windows-msvc/validation/build-log.txt' }
          }
      - name: Build and test Windows Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          ./scripts/package-windows-setup.ps1 -BuildDirectory build-windows-msvc
          ./tests/WindowsInstaller.Tests.ps1 -BuildDirectory build-windows-msvc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation-evidence
          path: build-windows-msvc/validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Tatree-2-Windows-Setup-tested
          path: build-windows-msvc/installer/*.zip
          if-no-files-found: error
  macos:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[windows only]')) || (github.event_name == 'workflow_dispatch' && inputs.build_macos)
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    env:
      TATREE_TEST_SYSTEM_INSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Build universal AU, VST3 and Standalone; test and package
        run: |
          set +e
          bash scripts/build-macos.command 2>&1 | tee macos-build.log
          result=${PIPESTATUS[0]}
          mkdir -p build-macos/validation
          cp macos-build.log build-macos/validation/build-log.txt
          if [ "$result" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s="\n".join(Path("macos-build.log").read_text(errors="replace").splitlines()[-25:])[-3500:]; print("::error title=macOS validation failed::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-validation-evidence
          path: build-macos/validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Tatree-2-macOS-Setup-UNSIGNED-TEST
          path: build-macos/installer/*.zip
          if-no-files-found: error
